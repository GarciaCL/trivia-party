<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trivia Party - Mando Móvil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="/play/play.css">
</head>
<body>

  <main class="player-container">
    <!-- Vista de Ingreso de Equipo -->
    <section id="login-view" class="card glass-card">
      <h1 class="game-title">TRIVIA PARTY</h1>
      <p class="subtitle">Ingresa el nombre de tu equipo:</p>
      <form id="form-join" class="form-join">
        <input type="text" id="input-team-name" class="input-text" placeholder="Ej: Los Invencibles" maxlength="20" required autocomplete="off">
        <button type="submit" class="btn btn-join">¡ENTRAR AL JUEGO! 🚀</button>
      </form>
    </section>

    <!-- Vista de Juego Activo -->
    <section id="game-view" class="card glass-card hidden">
      <header class="player-header">
        <span id="player-team-display" class="badge-team">Equipo</span>
        <span id="player-score-display" class="badge-score">0 pts</span>
      </header>

      <div class="buzzer-zone">
        <!-- Buzzer Gigante -->
        <button id="btn-buzzer" class="btn-buzzer pulse-animation">
          <span>¡ME LA SÉ!</span>
        </button>

        <!-- Bloque Modo Host: Hablar en voz alta -->
        <div id="host-mode-banner" class="locked-banner hidden">
          <p class="lock-icon">🎤</p>
          <h2 class="lock-title">¡HABLA EN VOZ ALTA!</h2>
          <p class="lock-desc">Dile tu respuesta al presentador.</p>
        </div>

        <!-- Botonera de Respuestas (Modo Auto) -->
        <div id="options-panel" class="options-container hidden">
          <div class="timer-bar"><div id="timer-progress" class="progress"></div></div>
          <div id="options-grid" class="options-grid"></div>
        </div>

        <!-- Banner de Turno Bloqueado para Otros Equipos -->
        <div id="locked-banner" class="locked-banner hidden">
          <p class="lock-icon">🔒</p>
          <h2 id="locked-msg" class="lock-title">¡Turno Bloqueado!</h2>
          <p id="locked-team-name" class="lock-desc">Otro equipo está respondiendo...</p>
        </div>
      </div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/play/play.js"></script>
</body>
</html>
