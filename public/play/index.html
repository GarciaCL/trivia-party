<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trivia Party - Mando Móvil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="/play/play.css">
</head>
<body>

  <!-- Vista 1: Ingreso de Equipo -->
  <section id="login-view" class="play-view glass-card">
    <h1 class="play-title">TRIVIA PARTY</h1>
    <p class="play-subtitle">Ingresa el nombre de tu equipo para jugar:</p>
    <form id="form-join">
      <input type="text" id="input-team-name" placeholder="Nombre de tu equipo" maxlength="20" required autocomplete="off">
      <button type="submit" class="btn btn-join">¡ENTRAR AL JUEGO! 🚀</button>
    </form>
    <div class="ad-slot" style="margin-top: 24px; width: 100%;">Publicidad / AdWords</div>
  </section>

  <!-- Vista 2 y 3: Juego Activo -->
  <section id="game-view" class="play-view hidden">
    <header class="team-bar glass-card">
      <span id="player-team-display">Equipo</span>
      <span id="player-score-display" class="team-score">0 pts</span>
    </header>

    <!-- Buzzer 3D -->
    <div id="buzzer-box" class="buzzer-container">
      <button id="btn-buzzer" class="buzzer-btn">
        <span class="buzzer-text">¡ME LA SÉ!</span>
      </button>
      <p id="buzzer-hint" class="buzzer-hint">¡Pulsa rápido cuando reconozcas el tema!</p>
    </div>

    <!-- Modo Presentador: Hablar en voz alta -->
    <div id="host-mode-banner" class="glass-card hidden" style="padding: 24px; width: 100%; margin: auto 0;">
      <p style="font-size: 3rem; margin-bottom: 10px;">🎤</p>
      <h2 style="color: var(--neon-cyan); margin-bottom: 8px;">¡HABLA EN VOZ ALTA!</h2>
      <p style="color: var(--text-muted);">El presentador está calificando tu respuesta.</p>
    </div>

    <!-- Bloqueo de Turno / Robo -->
    <div id="locked-banner" class="glass-card hidden" style="padding: 24px; width: 100%; margin: auto 0;">
      <p style="font-size: 3rem; margin-bottom: 10px;">🔒</p>
      <h2 id="locked-msg" style="color: var(--neon-yellow); margin-bottom: 8px;">¡Turno Bloqueado!</h2>
      <p id="locked-team-name" style="color: var(--text-muted);">Otro equipo está respondiendo...</p>
    </div>

    <!-- 4 Opciones 2x2 -->
    <div id="options-panel" class="hidden" style="width: 100%; margin: auto 0;">
      <div class="timer-wrapper">
        <span id="timer-countdown" class="timer-countdown">5s</span>
        <div id="timer-progress" class="timer-progress"></div>
      </div>
      <div id="options-grid" class="options-grid"></div>
    </div>

    <div class="ad-slot" style="margin-top: 20px; width: 100%;">Publicidad / AdWords</div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/play/play.js"></script>
</body>
</html>
