<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trivia Party - Gestor de Contenido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="padding: 24px; max-width: 1050px; margin: 0 auto;">

  <header class="glass-card" style="padding: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
    <h1 style="color: #00f0ff; font-size: 1.4rem;">🎛️ GESTOR DE CATÁLOGO E IA</h1>
    <a href="/tv" class="btn" style="background: #ff007f; color: #fff; text-decoration: none;">VOLVER A LA TV 📺</a>
  </header>

  <main style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px;">
    <!-- Formulario Crear / Editar -->
    <section class="glass-card" style="padding: 24px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
        <h2 id="form-heading" style="color: #ffd700;">➕ Nuevo Tema</h2>
        <button type="button" id="btn-cancel-edit" class="btn hidden" style="background: rgba(255,255,255,0.15); color: #fff; padding: 6px 12px; font-size: 0.85rem;">Cancelar edición</button>
      </div>

      <form id="form-add-item" style="display: flex; flex-direction: column; gap: 12px;">
        <input type="hidden" id="edit-item-id">
        <select id="item-type" style="padding: 12px; border-radius: 10px; background: #140533; color: #fff; border: 1px solid #00f0ff;">
          <option value="music">🎵 Canción (Modo Audio)</option>
          <option value="movie">🎬 Película / Serie (Modo Video)</option>
        </select>

        <div style="display: flex; gap: 8px;">
          <input type="text" id="item-title" placeholder="Título (Ej: Thriller - Michael Jackson)" required style="flex: 1; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
          <button type="button" id="btn-ai-options" class="btn" style="background: linear-gradient(135deg, #9d4edd, #ff007f); color: #fff; min-width: 90px;">✨ IA</button>
        </div>

        <!-- Indicador de progreso mientras trabaja la IA -->
        <div id="ai-loading-banner" class="hidden" style="padding: 10px 14px; border-radius: 10px; background: rgba(157, 78, 221, 0.25); border: 1px solid #9d4edd; color: #e0d4fc; font-size: 0.88rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center;">
          <span>🧠 Pensando opciones con Gemini IA...</span>
          <span id="ai-timer" style="color: #00f0ff;">0.0s</span>
        </div>

        <div style="display: flex; gap: 8px;">
          <input type="text" id="item-youtube" placeholder="URL o ID de YouTube" required style="flex: 1; padding: 12px; border-radius: 10px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
          <button type="button" id="btn-test-yt" class="btn" style="background: #00f0ff; color: #0d0221;">🔍 Probar</button>
        </div>

        <div style="display: flex; gap: 10px;">
          <label style="flex: 1; font-size: 0.85rem; color: #e0d4fc;">Inicio (seg):
            <input type="number" id="item-start" value="15" min="0" required style="width: 100%; margin-top: 4px; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
          </label>
          <label style="flex: 1; font-size: 0.85rem; color: #e0d4fc;">Coro/Festejo (seg):
            <input type="number" id="item-chorus" value="45" min="0" required style="width: 100%; margin-top: 4px; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
          </label>
        </div>

        <input type="text" id="opt-0" placeholder="Opción 1" required style="padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
        <input type="text" id="opt-1" placeholder="Opción 2" required style="padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
        <input type="text" id="opt-2" placeholder="Opción 3" required style="padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2);">
        <input type="text" id="opt-3" placeholder="Opción 4" required style="padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.4); color: #fff; border: 1px solid rgba(255,255,255,0.2);">

        <button type="submit" id="btn-save-item" class="btn" disabled style="background: #ff007f; color: #fff; padding: 14px; opacity: 0.45; cursor: not-allowed;">
          ⚠️ PRUEBA EL VIDEO PRIMERO
        </button>
      </form>
    </section>

    <!-- Vista Previa -->
    <section class="glass-card" style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      <h2 style="color: #00f0ff;">🎬 Vista Previa y Diagnóstico</h2>
      <div id="preview-status" style="padding: 14px; border-radius: 10px; background: rgba(255,255,255,0.08); font-weight: 700;">
        Pega un enlace de YouTube y pulsa "Probar" para verificar permisos.
      </div>
      <div style="width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden;">
        <div id="admin-yt-player"></div>
      </div>
    </section>
  </main>

  <!-- Listado de Catálogo Existente -->
  <section class="glass-card" style="padding: 24px;">
    <h2 style="color: #ffd700; margin-bottom: 16px;">📚 Catálogo Guardado (<span id="catalog-count">0</span>)</h2>
    <div id="catalog-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
  </section>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
